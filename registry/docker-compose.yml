# OAN Registry - local dev stack.
# Registry (Sunbird RC core) + its dependencies: postgres and keycloak,
# plus the protocol adapters for the Experience and Network layers.
#
# There is no Elasticsearch here. `/search` is served from postgres by
# NativeSearchService - see the registry service below.
#
# The Provider-layer adapter is deliberately not here yet.
#
# No credentials in this file. Everything secret comes from .env (see .env.example).
# Vars written as ${VAR:?...} are required - compose refuses to start without them.

services:
  db:
    image: postgres:14
    volumes:
      - ./${DB_DIR-db-data}:/var/lib/postgresql/data
    ports:
      - '${DB_HOST_PORT-5432}:5432'
    environment:
      - POSTGRES_DB=${POSTGRES_DB-registry}
      - POSTGRES_USER=${POSTGRES_USER-postgres}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER-postgres}']
      interval: 10s
      timeout: 5s
      retries: 5

  keycloak:
    image: ghcr.io/sunbird-rc/sunbird-rc-keycloak:latest
    volumes:
      - ./imports:/opt/jboss/keycloak/imports
    environment:
      - DB_VENDOR=postgres
      - DB_ADDR=db
      - DB_PORT=5432
      - DB_DATABASE=${POSTGRES_DB-registry}
      - DB_USER=${POSTGRES_USER-postgres}
      - DB_PASSWORD=${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      - KEYCLOAK_USER=${KEYCLOAK_ADMIN_USER-admin}
      - KEYCLOAK_PASSWORD=${KEYCLOAK_ADMIN_PASSWORD:?set KEYCLOAK_ADMIN_PASSWORD in .env}
      - KEYCLOAK_IMPORT=/opt/jboss/keycloak/imports/realm-export.json
      # lets a host-side caller ask for a token whose `iss` matches the registry's
      # internal expectation, via X-Forwarded-Host / X-Forwarded-Proto headers
      - PROXY_ADDRESS_FORWARDING=true
    ports:
      - '${KEYCLOAK_HOST_PORT-8080}:8080'
      - '${KEYCLOAK_ADMIN_HOST_PORT-9990}:9990'
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ['CMD-SHELL', 'curl -f http://localhost:9990/ || exit 1']
      interval: 30s
      timeout: 10s
      retries: 10

  registry:
    image: ghcr.io/sunbird-rc/sunbird-rc-core:${RELEASE_VERSION-v2.0.0}
    volumes:
      - ./${SCHEMA_DIR-schemas}:/home/sunbirdrc/config/public/_schemas
    environment:
      - connectionInfo_uri=jdbc:postgresql://db:5432/${POSTGRES_DB-registry}
      - connectionInfo_username=${POSTGRES_USER-postgres}
      - connectionInfo_password=${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      # `/search` reads the same postgres the writes go to, so it is immediately
      # consistent. Every filter operator works except `queryString`, which the
      # native provider rejects with "free-text queries not supported".
      - search_providerName=${SEARCH_PROVIDER_NAME-dev.sunbirdrc.registry.service.NativeSearchService}
      # keycloak / auth - role checks on Participant only apply while this is true
      - authentication_enabled=${AUTHENTICATION_ENABLED-true}
      - sunbird_sso_realm=${KEYCLOAK_REALM-sunbird-rc}
      - sunbird_sso_url=http://keycloak:8080/auth
      - OAUTH2_RESOURCES_0_URI=http://keycloak:8080/auth/realms/${KEYCLOAK_REALM-sunbird-rc}
      - OAUTH2_RESOURCES_0_PROPERTIES_ROLES_PATH=realm_access.roles
      - identity_provider=dev.sunbirdrc.auth.keycloak.KeycloakProviderImpl
      - sunbird_sso_admin_client_id=${KEYCLOAK_ADMIN_CLIENT_ID-admin-api}
      - sunbird_sso_client_id=${KEYCLOAK_CLIENT_ID-registry-frontend}
      - sunbird_sso_admin_client_secret=${KEYCLOAK_SECRET:?set KEYCLOAK_SECRET in .env - regenerate it on the admin-api client in the Keycloak console}
      - sunbird_keycloak_user_set_password=true
      - sunbird_keycloak_user_password=${REGISTRY_DEFAULT_USER_PASSWORD:?set REGISTRY_DEFAULT_USER_PASSWORD in .env}
      # everything the registry can optionally talk to is off: this stack is
      # participant records and lookup only, no credentials / DIDs / certificates
      - encryption_enabled=false
      - event_enabled=false
      - idgen_enabled=false
      - claims_enabled=false
      - did_enabled=false
      - signature_enabled=false
      - certificate_enabled=false
      - filestorage_enabled=false
      - notification_enabled=false
      - notification_async_enabled=false
      - async_enabled=false
      - webhook_enabled=false
      - registry_base_apis_enable=false
      - manager_type=DefinitionsManager
      - expand_reference=false
      - swagger_title=OAN Registry
      - logging.level.root=INFO
    ports:
      - '${REGISTRY_HOST_PORT-8081}:8081'
    depends_on:
      db:
        condition: service_healthy
      keycloak:
        condition: service_healthy
    healthcheck:
      test: ['CMD-SHELL', 'wget -nv -t1 --spider http://localhost:8081/health || exit 1']
      interval: 30s
      timeout: 10s
      retries: 10

  # Cache backing the adapters' cache plugin. Both beckn-one configs declare
  # `cache: redis` at redis:6379, and the adapter treats a failed cache
  # connection as fatal at startup -- so this is a hard dependency, not an
  # optimisation.
  #
  # No volume: nothing here needs to survive a restart.
  redis:
    image: redis:7-alpine
    ports:
      - '${REDIS_HOST_PORT-6379}:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5

  # --- protocol adapters ------------------------------------------------------
  #
  # Two of the three layers for now: Experience and Network Exchange. The
  # Provider-layer adapter is added later.
  #
  # Both load the oanregistry plugin and resolve counterparty public keys from
  # the registry above, so both wait for it to be healthy. Neither holds a key
  # this stack manages: a private signing key belongs to the adapter's own
  # keymanager config and never comes from the registry.
  #
  # Adapter configs live in ./adapter-config so this stack is self-contained --
  # clone it and everything needed is here. They originate from beckn-onix's
  # config/ directory; if you change them there, copy them across.
  #
  # Published image, so this stack needs nothing from the beckn-onix checkout:
  #   docker.io/ameersohel/oan-network-adapter
  #
  # `latest` moves. There is also a tag per source commit (e.g. :bf2a2bd) --
  # pin ADAPTER_IMAGE to one of those if you need to know exactly what ran.
  #
  # Rebuilt from beckn-onix/Dockerfile.adapter-with-plugins, which compiles the
  # plugins (including oanregistry.so) into the runtime image.
  #
  # The two adapters listen on different container ports -- 8081 for the
  # Experience one, 8082 for the Network one -- set by each adapter's own
  # config, not by anything here. The host ports differ again because the
  # registry already holds 8081.

  experience-adapter:
    image: ${ADAPTER_IMAGE-ameersohel/oan-network-adapter:latest}
    volumes:
      - ${ADAPTER_CONFIG_DIR-./adapter-config}:/app/config:ro
    environment:
      - CONFIG_FILE=/app/config/${EXPERIENCE_ADAPTER_CONFIG-local-beckn-one-bap.yaml}
    ports:
      - '${EXPERIENCE_ADAPTER_HOST_PORT-8082}:8081'
    depends_on:
      registry:
        condition: service_healthy
      redis:
        condition: service_healthy

  network-adapter:
    image: ${ADAPTER_IMAGE-ameersohel/oan-network-adapter:latest}
    volumes:
      - ${ADAPTER_CONFIG_DIR-./adapter-config}:/app/config:ro
    environment:
      - CONFIG_FILE=/app/config/${NETWORK_ADAPTER_CONFIG-local-beckn-one-bpp.yaml}
    ports:
      - '${NETWORK_ADAPTER_HOST_PORT-8083}:8082'
    depends_on:
      registry:
        condition: service_healthy
      redis:
        condition: service_healthy
